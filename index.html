<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScanForge | GitHub Pages</title>
    <meta
      name="description"
      content="ScanForge static demo for model preview, scaling, centering, and STL export on GitHub Pages."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel controls-panel">
        <div class="brand-block">
          <span class="eyebrow">ScanForge</span>
          <h1>GitHub Pages demo</h1>
        </div>

        <label class="file-picker">
          <span>Upload mesh</span>
          <input id="meshInput" type="file" accept=".obj,.stl,.ply" />
        </label>

        <div class="button-row">
          <button id="demoBtn" type="button">Load demo cube</button>
          <button id="centerBtn" type="button" class="secondary">Center model</button>
        </div>

        <div class="control-group">
          <label for="scaleInput">Scale factor</label>
          <div class="inline-control">
            <input id="scaleInput" type="number" min="0.1" step="0.1" value="1" />
            <button id="scaleBtn" type="button">Apply</button>
          </div>
        </div>

        <div class="control-group">
          <label for="sizeInput">Target longest side (mm)</label>
          <div class="inline-control">
            <input id="sizeInput" type="number" min="1" step="1" value="80" />
            <button id="sizeBtn" type="button">Resize</button>
          </div>
        </div>

        <div class="control-group export-group">
          <label>Export</label>
          <div class="button-row compact">
            <button id="downloadStlBtn" type="button">Download STL</button>
            <button id="downloadObjBtn" type="button" class="secondary">Download OBJ</button>
          </div>
        </div>

        <div class="metrics">
          <div>
            <span class="metric-label">Vertices</span>
            <strong id="vertexCount">0</strong>
          </div>
          <div>
            <span class="metric-label">Faces</span>
            <strong id="faceCount">0</strong>
          </div>
          <div>
            <span class="metric-label">Size</span>
            <strong id="sizeReadout">0 × 0 × 0</strong>
          </div>
        </div>
      </aside>

      <main class="viewer-panel">
        <div id="viewer" aria-label="3D mesh viewer"></div>
        <div class="status-bar">
          <span id="statusText">Ready.</span>
        </div>
      </main>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
